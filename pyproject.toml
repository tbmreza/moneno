[project]
name = "moneno"
version = "0.1.0"
description = "Lightweight team utility CLI."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pypdf>=4.0.0",
]

[project.scripts]
pdf-merge = "moneno.pdf_merge:app"
docx-images = "moneno.docx_images:app"
moneno-x = "moneno.launcher:app"

[project.optional-dependencies]
experimental = []

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneno"]
